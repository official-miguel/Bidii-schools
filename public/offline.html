<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2C7F7E" />
  <title>Bidii — Offline</title>
  <!--
    Served by public/sw.js when a page can't be fetched and was never opened
    before. Self-contained: only the precached icon is loaded.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #F5F7FA;
      color: #1F2933;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.25rem 1.75rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(31, 41, 51, .08), 0 0 0 1px rgba(0, 0, 0, .04);
    }
    .logo { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 1.25rem; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .5rem; }
    p { font-size: .9rem; color: #667085; line-height: 1.6; }
    .actions { display: grid; gap: .625rem; margin-top: 1.5rem; }
    button {
      border: 0;
      border-radius: 12px;
      padding: .8rem 1.25rem;
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    .primary { background: #2C7F7E; color: #fff; }
    .primary:hover { background: #256b6a; }
    .secondary { background: transparent; color: #2C7F7E; }
    .secondary:hover { background: #EDF7F7; }
    .hint { margin-top: 1rem; font-size: .75rem; color: #98A2B3; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icons/icon-192.png" alt="Bidii" width="72" height="72" />
    <h1>You're offline</h1>
    <p>
      This page hasn't been opened on this device yet, so it isn't available
      without internet. Pages you've opened before still work offline.
    </p>
    <div class="actions">
      <button class="primary" type="button" onclick="location.reload()">Try again</button>
      <button class="secondary" type="button" onclick="history.length > 1 ? history.back() : location.assign('/')">Go back</button>
    </div>
    <p class="hint">Saving changes needs a connection. This page reloads by itself when you're back online.</p>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
